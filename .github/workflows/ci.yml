name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests use the scripted mock model; the local-model extras are not installed in CI.
      - run: pip install -e ".[dev]"
      - run: pytest -q
